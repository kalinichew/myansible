---
- name: Install and configure Docker Engine CE
  hosts: debian_servers
  become: true
  gather_facts: true

  vars:
    docker_os: "{{ 'ubuntu' if ansible_distribution == 'Ubuntu' else 'debian' }}"
    docker_arch_map:
      x86_64: amd64
      aarch64: arm64
      armv7l: armhf
      ppc64le: ppc64el
      s390x: s390x

  pre_tasks:
    - name: Verify supported operating system and architecture
      ansible.builtin.assert:
        that:
          - ansible_os_family == "Debian"
          - ansible_distribution in ["Debian", "Ubuntu"]
          - ansible_architecture in docker_arch_map
        fail_msg: "Docker Engine playbook supports Debian/Ubuntu on listed Docker architectures."
      tags: [always, platform]

  handlers:
    - name: Restart Docker daemon
      ansible.builtin.service:
        name: docker
        state: restarted
      tags: [docker, service]

  tasks:
    - name: Install Docker repository prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
        state: present
        update_cache: true
        cache_valid_time: 3600
      tags: [packages, docker]

    - name: Ensure APT keyring directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"
      tags: [docker, config]

    - name: Download official Docker repository signing key
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/{{ docker_os }}/gpg"
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"
        owner: root
        group: root
      tags: [docker, repository, config]

    - name: Configure official Docker APT repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ docker_arch_map[ansible_architecture] }}
          signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/{{ docker_os }}
          {{ ansible_distribution_release }} stable
        filename: docker
        state: present
        update_cache: true
      tags: [docker, repository, packages]

    - name: Install Docker Engine and Compose plugin
      ansible.builtin.apt:
        name:
          - containerd.io
          - docker-buildx-plugin
          - docker-ce
          - docker-ce-cli
          - docker-compose-plugin
        state: present
        update_cache: true
      tags: [docker, packages]

    - name: Configure Docker log rotation and daemon behavior
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        content: |
          {
            "log-driver": "json-file",
            "log-opts": {
              "max-size": "{{ docker_daemon_log_max_size }}",
              "max-file": "{{ docker_daemon_log_max_file }}"
            },
            "live-restore": {{ docker_daemon_live_restore | to_json }}
          }
        owner: root
        group: root
        mode: "0644"
        validate: "dockerd --validate --config-file %s"
      notify: Restart Docker daemon
      tags: [docker, config, service]

    - name: Ensure Docker group exists
      ansible.builtin.group:
        name: docker
        state: present
      tags: [docker, users]

    - name: Add configured administrators to Docker group
      ansible.builtin.user:
        name: "{{ item }}"
        groups: docker
        append: true
        state: present
      loop: "{{ docker_admin_users }}"
      tags: [docker, users]

    - name: Ensure Docker daemon is enabled and running
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started
      tags: [docker, service]
