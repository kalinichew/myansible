---
- name: Configure base system and create a sudo user
  hosts: all
  become: true
  gather_facts: true

  pre_tasks:
    - name: Verify supported operating system
      ansible.builtin.assert:
        that:
          - ansible_os_family == "Debian"
          - ansible_distribution in ["Debian", "Ubuntu"]
        fail_msg: "This playbook supports Debian and Ubuntu only."
      tags: [always, platform]

    - name: Verify new user configuration
      ansible.builtin.assert:
        that:
          - bootstrap_user_name | length > 0
          - bootstrap_user_name != "root"
          - bootstrap_user_password_hash | length > 0
          - bootstrap_user_groups | length > 0
          - "'sudo' in bootstrap_user_groups"
        fail_msg: "Set a non-root user name, password hash, and sudo group in Ansible Vault/vars."
      tags: [always, users]

    - name: Verify SSH public key exists on the Ansible controller
      ansible.builtin.assert:
        that:
          - lookup('ansible.builtin.file', bootstrap_ssh_public_key_path, errors='ignore') | trim | length > 0
        fail_msg: >-
          No public key was found at {{ bootstrap_ssh_public_key_path }}.
          Set bootstrap_ssh_public_key_path to an existing .pub file.
      become: false
      run_once: true
      tags: [always, ssh, users]

  tasks:
    - name: Refresh APT package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      tags: [packages, apt]

    - name: Install base system utilities
      ansible.builtin.apt:
        name: "{{ bootstrap_base_packages }}"
        state: present
      tags: [packages, apt]

    - name: Set system timezone
      community.general.timezone:
        name: "{{ bootstrap_timezone }}"
      tags: [config, timezone]

    - name: Generate configured system locale
      community.general.locale_gen:
        name: "{{ bootstrap_locale }}"
        state: present
      tags: [config, locale]

    - name: Ensure user groups exist
      ansible.builtin.group:
        name: "{{ item }}"
        state: present
      loop: "{{ bootstrap_user_groups }}"
      tags: [users, config]

    - name: Create regular user with sudo access
      ansible.builtin.user:
        name: "{{ bootstrap_user_name }}"
        shell: "{{ bootstrap_user_shell }}"
        password: "{{ bootstrap_user_password_hash }}"
        update_password: always
        password_lock: false
        groups: "{{ bootstrap_user_groups | join(',') }}"
        append: true
        create_home: true
        state: present
      no_log: true
      tags: [users, config]

    - name: Install user's SSH public key
      ansible.posix.authorized_key:
        user: "{{ bootstrap_user_name }}"
        state: present
        key: "{{ lookup('ansible.builtin.file', bootstrap_ssh_public_key_path) }}"
        exclusive: false
      tags: [users, ssh, config]
