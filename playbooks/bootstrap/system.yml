---
- name: Prepare Debian or Ubuntu operating system
  hosts: all
  become: true
  gather_facts: true

  pre_tasks:
    - name: Verify supported operating system
      ansible.builtin.assert:
        that:
          - ansible_os_family == "Debian"
          - ansible_distribution in ["Debian", "Ubuntu"]
        fail_msg: "This playbook supports Debian and Ubuntu only."
      tags: [always, platform]

  tasks:
    - name: Refresh APT package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      tags: [packages, apt]

    - name: Install base system utilities
      ansible.builtin.apt:
        name: "{{ bootstrap_base_packages }}"
        state: present
      tags: [packages, apt]

    - name: Set system timezone
      community.general.timezone:
        name: "{{ bootstrap_timezone }}"
      tags: [config, timezone]

    - name: Generate configured system locale
      community.general.locale_gen:
        name: "{{ bootstrap_locale }}"
        state: present
      tags: [config, locale]
