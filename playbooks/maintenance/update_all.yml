---
- name: Patch Debian and Ubuntu servers safely
  hosts: all
  become: true
  gather_facts: true
  serial: 1
  max_fail_percentage: 0

  pre_tasks:
    - name: Verify supported operating system
      ansible.builtin.assert:
        that:
          - ansible_os_family == "Debian"
          - ansible_distribution in ["Debian", "Ubuntu"]
        fail_msg: "This maintenance playbook supports Debian and Ubuntu only."
      tags: [always, platform]

  tasks:
    - name: Refresh APT package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      tags: [packages, updates]

    - name: Apply distribution upgrade
      ansible.builtin.apt:
        upgrade: dist
        dpkg_options: force-confdef,force-confold
        autoremove: true
        autoclean: true
      register: apt_upgrade
      tags: [packages, updates]

    - name: Check whether the host requires a reboot
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required
      tags: [reboot, maintenance]

    - name: Safely reboot host when required
      ansible.builtin.reboot:
        msg: "Reboot initiated by Ansible after system updates"
        reboot_timeout: "{{ maintenance_reboot_timeout }}"
        connect_timeout: 10
        post_reboot_delay: 15
        test_command: /usr/bin/true
      when:
        - maintenance_reboot_if_required | bool
        - reboot_required.stat.exists
      tags: [reboot, maintenance]
