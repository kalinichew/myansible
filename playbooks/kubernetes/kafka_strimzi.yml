---
- name: Deploy a persistent Kafka cluster with Strimzi
  hosts: localhost
  connection: local
  gather_facts: false

  pre_tasks:
    - name: Require durable storage and a three-node HA baseline
      ansible.builtin.assert:
        that:
          - kafka_storage_class | length > 0
          - kafka_controller_replicas | int >= 3
          - kafka_broker_replicas | int >= 3
          - kafka_broker_replicas | int >= kafka_topic_partitions | int
        fail_msg: >-
          Set kafka_storage_class and use at least three controllers and brokers.
          Broker replicas must be at least the topic partition count.
      tags: [always, kafka, validation]

  tasks:
    - name: Ensure Kafka namespace exists
      kubernetes.core.k8s:
        kubeconfig: "{{ k8s_kubeconfig }}"
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ kafka_namespace }}"
      tags: [kafka, namespace, config]

    - name: Add official Strimzi Helm repository
      kubernetes.core.helm_repository:
        name: strimzi
        repo_url: https://strimzi.io/charts/
        state: present
      tags: [kafka, helm, repository]

    - name: Install the pinned Strimzi Cluster Operator chart
      kubernetes.core.helm:
        kubeconfig: "{{ k8s_kubeconfig }}"
        name: "{{ kafka_operator_release_name }}"
        chart_ref: strimzi/strimzi-kafka-operator
        chart_version: "{{ kafka_operator_chart_version }}"
        release_namespace: "{{ kafka_namespace }}"
        create_namespace: true
        update_repo_cache: true
        wait: true
        wait_timeout: 600s
      tags: [kafka, helm, operator]

    - name: Wait for Strimzi Kafka custom resource definitions
      kubernetes.core.k8s_info:
        kubeconfig: "{{ k8s_kubeconfig }}"
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: "{{ item }}"
      loop:
        - kafkas.kafka.strimzi.io
        - kafkanodepools.kafka.strimzi.io
        - kafkatopics.kafka.strimzi.io
        - kafkausers.kafka.strimzi.io
      register: kafka_crds
      until: kafka_crds.resources | length > 0
      retries: 30
      delay: 10
      tags: [kafka, operator, readiness]

    - name: Apply Kafka cluster, node pools, topic, and restricted client user
      kubernetes.core.k8s:
        kubeconfig: "{{ k8s_kubeconfig }}"
        state: present
        definition:
          - apiVersion: kafka.strimzi.io/v1
            kind: KafkaNodePool
            metadata:
              name: "{{ kafka_cluster_name }}-controllers"
              namespace: "{{ kafka_namespace }}"
              labels:
                strimzi.io/cluster: "{{ kafka_cluster_name }}"
            spec:
              replicas: "{{ kafka_controller_replicas | int }}"
              roles:
                - controller
              storage:
                type: jbod
                volumes:
                  - id: 0
                    type: persistent-claim
                    class: "{{ kafka_storage_class }}"
                    size: "{{ kafka_controller_storage_size }}"
                    deleteClaim: false
              resources:
                requests:
                  cpu: "1"
                  memory: 2Gi
                limits:
                  cpu: "2"
                  memory: 4Gi
          - apiVersion: kafka.strimzi.io/v1
            kind: KafkaNodePool
            metadata:
              name: "{{ kafka_cluster_name }}-brokers"
              namespace: "{{ kafka_namespace }}"
              labels:
                strimzi.io/cluster: "{{ kafka_cluster_name }}"
            spec:
              replicas: "{{ kafka_broker_replicas | int }}"
              roles:
                - broker
              storage:
                type: jbod
                volumes:
                  - id: 0
                    type: persistent-claim
                    class: "{{ kafka_storage_class }}"
                    size: "{{ kafka_broker_storage_size }}"
                    deleteClaim: false
              resources:
                requests:
                  cpu: "1"
                  memory: 4Gi
                limits:
                  cpu: "4"
                  memory: 8Gi
          - apiVersion: kafka.strimzi.io/v1
            kind: Kafka
            metadata:
              name: "{{ kafka_cluster_name }}"
              namespace: "{{ kafka_namespace }}"
              annotations:
                strimzi.io/node-pools: enabled
                strimzi.io/kraft: enabled
            spec:
              kafka:
                version: "{{ kafka_version }}"
                listeners:
                  - name: tls
                    port: 9093
                    type: internal
                    tls: true
                    authentication:
                      type: scram-sha-512
                config:
                  default.replication.factor: 3
                  min.insync.replicas: 2
                  offsets.topic.replication.factor: 3
                  transaction.state.log.replication.factor: 3
                  transaction.state.log.min.isr: 2
                resources:
                  requests:
                    cpu: "1"
                    memory: 4Gi
                  limits:
                    cpu: "4"
                    memory: 8Gi
              entityOperator:
                topicOperator: {}
                userOperator: {}
          - apiVersion: kafka.strimzi.io/v1
            kind: KafkaTopic
            metadata:
              name: "{{ kafka_topic_name }}"
              namespace: "{{ kafka_namespace }}"
              labels:
                strimzi.io/cluster: "{{ kafka_cluster_name }}"
            spec:
              partitions: "{{ kafka_topic_partitions | int }}"
              replicas: "{{ kafka_broker_replicas | int }}"
              config:
                retention.ms: "{{ kafka_topic_retention_ms }}"
          - apiVersion: kafka.strimzi.io/v1
            kind: KafkaUser
            metadata:
              name: "{{ kafka_app_user }}"
              namespace: "{{ kafka_namespace }}"
              labels:
                strimzi.io/cluster: "{{ kafka_cluster_name }}"
            spec:
              authentication:
                type: scram-sha-512
              authorization:
                type: simple
                acls:
                  - resource:
                      type: topic
                      name: "{{ kafka_topic_name }}"
                      patternType: literal
                    operations:
                      - Read
                      - Write
                      - Describe
                    host: "*"
                  - resource:
                      type: group
                      name: app-
                      patternType: prefix
                    operations:
                      - Read
                      - Describe
                    host: "*"
      tags: [kafka, cluster, topic, users, config]

    - name: Show Kafka bootstrap address and generated user secret
      ansible.builtin.debug:
        msg:
          bootstrap: "{{ kafka_cluster_name }}-kafka-bootstrap.{{ kafka_namespace }}.svc:9093"
          user_secret: "{{ kafka_app_user }}"
          note: "TLS and SCRAM-SHA-512 are required; read the generated password from the Kubernetes Secret."
      tags: [kafka, access]
