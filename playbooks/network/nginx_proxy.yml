---
- name: Configure NGINX reverse proxy and Let's Encrypt
  hosts: all
  become: true
  gather_facts: true

  pre_tasks:
    - name: Require at least one proxy site
      ansible.builtin.assert:
        that:
          - nginx_proxy_sites | length > 0
        fail_msg: "Define at least one nginx_proxy_sites entry."
      tags: [always, nginx]

    - name: Validate proxy site definitions
      ansible.builtin.assert:
        that:
          - ansible_os_family == "Debian"
          - ansible_distribution in ["Debian", "Ubuntu"]
          - nginx_proxy_sites | length > 0
          - item.server_name is defined
          - item.upstream_url is defined
          - item.email is defined
        fail_msg: "Define server_name, upstream_url, and email for every NGINX proxy site."
      loop: "{{ nginx_proxy_sites }}"
      tags: [always, platform, nginx]

  handlers:
    - name: Reload NGINX
      ansible.builtin.service:
        name: nginx
        state: reloaded
      tags: [nginx, service]

  tasks:
    - name: Install NGINX and Certbot packages
      ansible.builtin.apt:
        name:
          - certbot
          - nginx
        state: present
        update_cache: true
        cache_valid_time: 3600
      tags: [nginx, certbot, packages]

    - name: Ensure ACME webroot exists
      ansible.builtin.file:
        path: "{{ nginx_proxy_webroot }}"
        state: directory
        owner: www-data
        group: www-data
        mode: "0755"
      tags: [nginx, certbot, config]

    - name: Remove default NGINX virtual host
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Reload NGINX
      tags: [nginx, config]

    - name: Install HTTP bootstrap proxy site for ACME validation
      ansible.builtin.copy:
        dest: "/etc/nginx/sites-enabled/{{ item.server_name }}.conf"
        content: |
          server {
              listen 80;
              listen [::]:80;
              server_name {{ item.server_name }};

              location ^~ /.well-known/acme-challenge/ {
                  root {{ nginx_proxy_webroot }};
                  default_type "text/plain";
              }

              location / {
                  proxy_pass {{ item.upstream_url }};
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }
        owner: root
        group: root
        mode: "0644"
      loop: "{{ nginx_proxy_sites }}"
      notify: Reload NGINX
      tags: [nginx, config]

    - name: Validate bootstrap NGINX configuration
      ansible.builtin.command:
        argv:
          - nginx
          - -t
      changed_when: false
      tags: [nginx, config, validation]

    - name: Ensure NGINX is enabled and running for ACME validation
      ansible.builtin.service:
        name: nginx
        enabled: true
        state: started
      tags: [nginx, service]

    - name: Request Let's Encrypt certificate through webroot
      ansible.builtin.command:
        argv:
          - certbot
          - certonly
          - --webroot
          - --webroot-path
          - "{{ nginx_proxy_webroot }}"
          - --non-interactive
          - --agree-tos
          - --email
          - "{{ item.email }}"
          - -d
          - "{{ item.server_name }}"
        creates: "/etc/letsencrypt/live/{{ item.server_name }}/fullchain.pem"
      loop: "{{ nginx_proxy_sites }}"
      tags: [nginx, certbot, certificates]

    - name: Install TLS reverse proxy site
      ansible.builtin.copy:
        dest: "/etc/nginx/sites-enabled/{{ item.server_name }}.conf"
        content: |
          server {
              listen 80;
              listen [::]:80;
              server_name {{ item.server_name }};

              location ^~ /.well-known/acme-challenge/ {
                  root {{ nginx_proxy_webroot }};
                  default_type "text/plain";
              }

              location / {
                  return 301 https://$host$request_uri;
              }
          }

          server {
              listen 443 ssl;
              listen [::]:443 ssl;
              server_name {{ item.server_name }};

              ssl_certificate /etc/letsencrypt/live/{{ item.server_name }}/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/{{ item.server_name }}/privkey.pem;
              ssl_protocols TLSv1.2 TLSv1.3;
              ssl_session_cache shared:SSL:10m;
              ssl_session_timeout 10m;

              location / {
                  proxy_pass {{ item.upstream_url }};
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }
        owner: root
        group: root
        mode: "0644"
      loop: "{{ nginx_proxy_sites }}"
      notify: Reload NGINX
      tags: [nginx, config, tls]

    - name: Validate final TLS NGINX configuration
      ansible.builtin.command:
        argv:
          - nginx
          - -t
      changed_when: false
      tags: [nginx, config, tls, validation]

    - name: Ensure Certbot deploy-hook directory exists
      ansible.builtin.file:
        path: /etc/letsencrypt/renewal-hooks/deploy
        state: directory
        owner: root
        group: root
        mode: "0755"
      tags: [certbot, config]

    - name: Install NGINX reload hook for renewed certificates
      ansible.builtin.copy:
        dest: /etc/letsencrypt/renewal-hooks/deploy/reload-nginx
        content: |
          #!/bin/sh
          /usr/bin/systemctl reload nginx
        owner: root
        group: root
        mode: "0750"
      tags: [certbot, config, service]

    - name: Ensure Certbot renewal timer is enabled
      ansible.builtin.service:
        name: certbot.timer
        enabled: true
        state: started
      tags: [certbot, service]
