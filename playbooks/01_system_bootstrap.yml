---
- name: Bootstrap Debian and Ubuntu servers
  hosts: bootstrap
  become: true
  gather_facts: true

  vars:
    bootstrap_user: "work_user"
    bootstrap_ssh_public_key_path: "{{ lookup('env', 'HOME') }}/.ssh/id_ed25519.pub"
    bootstrap_timezone: "Europe/Moscow"
    bootstrap_locale: "en_US.UTF-8"
    # Passwordless sudo is convenient for a key-only bootstrap account.
    # Set to false after configuring a password for bootstrap_user.
    bootstrap_passwordless_sudo: true
    bootstrap_packages:
      - ca-certificates
      - curl
      - git
      - htop
      - jq
      - ncdu
      - net-tools
      - ripgrep
      - rsync
      - sudo
      - tmux
      - vim
      - wget
      - locales

  handlers:
    - name: Restart ssh service
      ansible.builtin.service:
        name: ssh
        state: restarted

  pre_tasks:
    - name: Verify supported operating system
      ansible.builtin.assert:
        that:
          - ansible_os_family == "Debian"
        fail_msg: >-
          This playbook supports Debian and Ubuntu only. It uses apt, the sudo
          group, and Debian's locale_gen module.

    - name: Verify SSH public key exists on the Ansible controller
      ansible.builtin.assert:
        that:
          - lookup('ansible.builtin.file', bootstrap_ssh_public_key_path, errors='ignore') | trim | length > 0
        fail_msg: >-
          SSH public key not found at {{ bootstrap_ssh_public_key_path }}.
          Set bootstrap_ssh_public_key_path to the path of your .pub file.
      become: false
      run_once: true

  tasks:
    - name: Set system timezone
      community.general.timezone:
        name: "{{ bootstrap_timezone }}"
      tags: [system, timezone]

    - name: Generate system locale
      community.general.locale_gen:
        name: "{{ bootstrap_locale }}"
        state: present
      tags: [system, locale]

    - name: Update apt package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      tags: [packages]

    - name: Install baseline packages
      ansible.builtin.apt:
        name: "{{ bootstrap_packages }}"
        state: present
      tags: [packages]

    - name: Ensure sudo group exists
      ansible.builtin.group:
        name: sudo
        state: present
      tags: [users]

    - name: Create administrator account
      ansible.builtin.user:
        name: "{{ bootstrap_user }}"
        shell: /bin/bash
        groups: sudo
        append: true
        create_home: true
        state: present
      tags: [users]

    - name: Configure sudo access for administrator
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/{{ bootstrap_user }}"
        content: "{{ bootstrap_user }} ALL=(ALL) {{ 'NOPASSWD:' if bootstrap_passwordless_sudo else '' }}ALL\n"
        owner: root
        group: root
        mode: "0440"
        validate: "visudo -cf %s"
      tags: [users, sudo]

    - name: Install SSH public key for administrator
      ansible.posix.authorized_key:
        user: "{{ bootstrap_user }}"
        state: present
        key: "{{ lookup('ansible.builtin.file', bootstrap_ssh_public_key_path) }}"
      tags: [users, ssh]

    - name: Disable SSH password authentication
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^\\s*#?\\s*PasswordAuthentication\\s+"
        line: "PasswordAuthentication no"
        state: present
        validate: "/usr/sbin/sshd -t -f %s"
        backup: true
      notify: Restart ssh service
      tags: [ssh, hardening]

    - name: Disable SSH root password login
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^\\s*#?\\s*PermitRootLogin\\s+"
        line: "PermitRootLogin prohibit-password"
        state: present
        validate: "/usr/sbin/sshd -t -f %s"
        backup: true
      notify: Restart ssh service
      tags: [ssh, hardening]
