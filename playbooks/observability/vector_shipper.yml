---
- name: Install and configure Vector log shipper
  hosts: all
  become: true
  gather_facts: true

  pre_tasks:
    - name: Check Docker socket required by the container log source
      ansible.builtin.stat:
        path: /var/run/docker.sock
      register: vector_docker_socket
      tags: [always, docker, vector]

    - name: Require Docker Engine for Docker log collection
      ansible.builtin.assert:
        that:
          - vector_docker_socket.stat.exists
        fail_msg: "Install Docker Engine before enabling the Vector Docker log source."
      tags: [always, docker, vector]

    - name: Validate Vector destination and token
      ansible.builtin.assert:
        that:
          - ansible_os_family == "Debian"
          - ansible_distribution in ["Debian", "Ubuntu"]
          - vector_sink_url is match('^https://')
          - vector_sink_auth_token | length > 0
        fail_msg: "Set an HTTPS vector_sink_url and store vector_sink_auth_token in Ansible Vault."
      no_log: true
      tags: [always, platform, vector]

  handlers:
    - name: Reload systemd and restart Vector
      ansible.builtin.systemd_service:
        name: vector.service
        daemon_reload: true
        enabled: true
        state: restarted
      tags: [vector, service]

  tasks:
    - name: Install APT repository prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
        state: present
        update_cache: true
        cache_valid_time: 3600
      tags: [vector, packages]

    - name: Ensure APT keyring directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"
      tags: [vector, repository, config]

    - name: Download Vector repository signing key
      ansible.builtin.get_url:
        url: https://keys.datadoghq.com/DATADOG_APT_KEY_CURRENT.public
        dest: /etc/apt/keyrings/vector.asc
        owner: root
        group: root
        mode: "0644"
      tags: [vector, repository, config]

    - name: Configure official Vector APT repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/vector.asc] https://apt.vector.dev/ stable vector-0"
        filename: vector
        state: present
        update_cache: true
      tags: [vector, repository, packages]

    - name: Install Vector package
      ansible.builtin.apt:
        name: vector
        state: present
        update_cache: true
      tags: [vector, packages]

    - name: Ensure Docker group exists for Docker log access
      ansible.builtin.group:
        name: docker
        state: present
      tags: [vector, users, docker]

    - name: Ensure Vector systemd drop-in directory exists
      ansible.builtin.file:
        path: /etc/systemd/system/vector.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"
      tags: [vector, config, service]

    - name: Add Vector service account to log-reading groups
      ansible.builtin.user:
        name: vector
        groups:
          - systemd-journal
          - docker
        append: true
        state: present
      tags: [vector, users]

    - name: Ensure Vector data directory exists
      ansible.builtin.file:
        path: "{{ vector_data_dir }}"
        state: directory
        owner: vector
        group: vector
        mode: "0750"
      tags: [vector, config]

    - name: Install Vector sink credentials from Vault
      ansible.builtin.copy:
        dest: /etc/default/vector-shipper
        content: |
          VECTOR_SINK_AUTH_TOKEN={{ vector_sink_auth_token }}
        owner: root
        group: vector
        mode: "0640"
      no_log: true
      notify: Reload systemd and restart Vector
      tags: [vector, secrets, config, service]

    - name: Configure Vector journald and Docker log sources
      ansible.builtin.copy:
        dest: /etc/vector/vector.yaml
        content: |
          data_dir: {{ vector_data_dir }}
          sources:
            host_journal:
              type: journald
            container_logs:
              type: docker_logs
          sinks:
            remote_logs:
              type: http
              inputs:
                - host_journal
                - container_logs
              uri: {{ vector_sink_url | to_json }}
              method: post
              encoding:
                codec: json
              auth:
                strategy: bearer
                token: "${VECTOR_SINK_AUTH_TOKEN}"
              batch:
                max_bytes: 1048576
                timeout_secs: 5
        owner: root
        group: vector
        mode: "0640"
      notify: Reload systemd and restart Vector
      tags: [vector, config, service]

    - name: Configure Vector systemd environment file
      ansible.builtin.copy:
        dest: /etc/systemd/system/vector.service.d/override.conf
        content: |
          [Service]
          EnvironmentFile=/etc/default/vector-shipper
        owner: root
        group: root
        mode: "0644"
      notify: Reload systemd and restart Vector
      tags: [vector, config, service]

    - name: Validate Vector configuration
      ansible.builtin.command:
        argv:
          - vector
          - validate
          - --no-environment
          - --config-yaml
          - /etc/vector/vector.yaml
      environment:
        VECTOR_SINK_AUTH_TOKEN: "{{ vector_sink_auth_token }}"
      changed_when: false
      no_log: true
      tags: [vector, config, validation]

    - name: Apply Vector unit changes before managing service
      ansible.builtin.meta: flush_handlers
      tags: [vector, service]

    - name: Ensure Vector is enabled and running
      ansible.builtin.systemd_service:
        name: vector.service
        enabled: true
        state: started
      tags: [vector, service]
