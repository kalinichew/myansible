---
- name: Install Prometheus Node Exporter as a systemd service
  hosts: all
  become: true
  gather_facts: true

  vars:
    node_exporter_arch_map:
      x86_64: amd64
      aarch64: arm64

  pre_tasks:
    - name: Validate Node Exporter platform and release checksum
      ansible.builtin.assert:
        that:
          - ansible_os_family == "Debian"
          - ansible_distribution in ["Debian", "Ubuntu"]
          - ansible_architecture in node_exporter_arch_map
          - node_exporter_sha256[node_exporter_arch_map[ansible_architecture]] is defined
        fail_msg: "No verified Node Exporter release checksum is configured for this platform."
      tags: [always, platform, node_exporter]

  handlers:
    - name: Reload systemd and restart Node Exporter
      ansible.builtin.systemd_service:
        name: node_exporter.service
        daemon_reload: true
        enabled: true
        state: restarted
      tags: [node_exporter, service]

  tasks:
    - name: Install archive extraction utility
      ansible.builtin.apt:
        name: tar
        state: present
      tags: [node_exporter, packages]

    - name: Create Node Exporter system group
      ansible.builtin.group:
        name: node_exporter
        system: true
        state: present
      tags: [node_exporter, users]

    - name: Create Node Exporter system user
      ansible.builtin.user:
        name: node_exporter
        group: node_exporter
        system: true
        shell: /usr/sbin/nologin
        home: /nonexistent
        create_home: false
        state: present
      tags: [node_exporter, users]

    - name: Download verified Node Exporter release archive
      ansible.builtin.get_url:
        url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch_map[ansible_architecture] }}.tar.gz"
        dest: "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch_map[ansible_architecture] }}.tar.gz"
        checksum: "sha256:{{ node_exporter_sha256[node_exporter_arch_map[ansible_architecture]] }}"
        owner: root
        group: root
        mode: "0644"
      tags: [node_exporter, download]

    - name: Extract Node Exporter release
      ansible.builtin.unarchive:
        src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch_map[ansible_architecture] }}.tar.gz"
        dest: /tmp
        remote_src: true
        creates: "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch_map[ansible_architecture] }}/node_exporter"
      tags: [node_exporter, install]

    - name: Install Node Exporter binary
      ansible.builtin.copy:
        src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch_map[ansible_architecture] }}/node_exporter"
        dest: /usr/local/bin/node_exporter
        remote_src: true
        owner: root
        group: root
        mode: "0755"
      notify: Reload systemd and restart Node Exporter
      tags: [node_exporter, install, service]

    - name: Install Node Exporter systemd unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/node_exporter.service
        content: |
          [Unit]
          Description=Prometheus Node Exporter
          Documentation=https://github.com/prometheus/node_exporter
          After=network-online.target
          Wants=network-online.target

          [Service]
          User=node_exporter
          Group=node_exporter
          Type=simple
          ExecStart=/usr/local/bin/node_exporter --web.listen-address={{ node_exporter_listen_address }}:{{ node_exporter_port }}
          Restart=on-failure
          RestartSec=5s
          NoNewPrivileges=true
          ProtectSystem=strict
          ProtectHome=true
          PrivateTmp=true
          ProtectKernelTunables=true
          ProtectKernelModules=true
          ProtectControlGroups=true
          RestrictSUIDSGID=true
          LockPersonality=true

          [Install]
          WantedBy=multi-user.target
        owner: root
        group: root
        mode: "0644"
      notify: Reload systemd and restart Node Exporter
      tags: [node_exporter, config, service]

    - name: Apply Node Exporter unit changes before managing service
      ansible.builtin.meta: flush_handlers
      tags: [node_exporter, service]

    - name: Ensure Node Exporter is enabled and running
      ansible.builtin.systemd_service:
        name: node_exporter.service
        enabled: true
        state: started
      tags: [node_exporter, service]
