---
- name: Schedule compressed PostgreSQL backups to S3
  hosts: debian_servers
  become: true
  gather_facts: true

  vars:
    db_backup_database: "{{ postgres_database }}"

  pre_tasks:
    - name: Validate S3 backup configuration
      ansible.builtin.assert:
        that:
          - ansible_os_family == "Debian"
          - ansible_distribution in ["Debian", "Ubuntu"]
          - db_backup_s3_bucket is match('^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$')
          - db_backup_s3_prefix is match('^[A-Za-z0-9/_=.-]+          - db_backup_database | length > 0
        fail_msg: "Set a valid S3 bucket, prefix, and PostgreSQL database before scheduling backups."
      tags: [always, platform, backup]

  handlers:
    - name: Reload systemd and restart PostgreSQL backup timer
      ansible.builtin.systemd_service:
        name: db-backup.timer
        daemon_reload: true
        enabled: true
        state: restarted
      tags: [backup, service, systemd]

  tasks:
    - name: Install PostgreSQL backup utilities
      ansible.builtin.apt:
        name:
          - awscli
          - postgresql-client
          - zstd
        state: present
        update_cache: true
        cache_valid_time: 3600
      tags: [backup, packages]

    - name: Ensure backup directory exists
      ansible.builtin.file:
        path: "{{ db_backup_local_dir }}"
        state: directory
        owner: postgres
        group: postgres
        mode: "0750"
      tags: [backup, config]

    - name: Install S3 backup script
      ansible.builtin.copy:
        dest: /usr/local/sbin/postgresql-s3-backup
        content: |
          #!/usr/bin/env bash
          set -Eeuo pipefail
          umask 077

          timestamp="$(/usr/bin/date -u +%Y%m%dT%H%M%SZ)"
          filename="{{ inventory_hostname }}_{{ db_backup_database }}_${timestamp}.sql.zst"
          local_file="{{ db_backup_local_dir }}/${filename}"
          temporary_file="$(/usr/bin/mktemp "{{ db_backup_local_dir }}/.backup.XXXXXX")"
          trap '/usr/bin/rm -f "${temporary_file}"' EXIT

          /usr/bin/pg_dump --no-owner --no-acl --format=plain "{{ db_backup_database }}" |
            /usr/bin/zstd -T0 -{{ db_backup_zstd_level }} -o "${temporary_file}"

          /usr/bin/aws s3 cp "${temporary_file}" \
            "s3://$DB_BACKUP_S3_BUCKET/$DB_BACKUP_S3_PREFIX/${filename}" \
            --only-show-errors --sse AES256

          /usr/bin/mv "${temporary_file}" "${local_file}"
          /usr/bin/find "{{ db_backup_local_dir }}" -type f -name '*.sql.zst' \
            -mtime +{{ db_backup_retention_days }} -delete
        owner: root
        group: root
        mode: "0750"
      notify: Reload systemd and restart PostgreSQL backup timer
      tags: [backup, config, script]

    - name: Install S3 backup environment file
      ansible.builtin.copy:
        dest: /etc/default/postgresql-s3-backup
        content: |
          DB_BACKUP_S3_BUCKET={{ db_backup_s3_bucket }}
          AWS_DEFAULT_REGION={{ db_backup_aws_region }}
          DB_BACKUP_S3_PREFIX={{ db_backup_s3_prefix }}
        owner: root
        group: postgres
        mode: "0640"
      notify: Reload systemd and restart PostgreSQL backup timer
      tags: [backup, config]

    - name: Install PostgreSQL backup service unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/db-backup.service
        content: |
          [Unit]
          Description=Compressed PostgreSQL backup to S3
          After=network-online.target postgresql.service
          Wants=network-online.target
          Requires=postgresql.service

          [Service]
          Type=oneshot
          User=postgres
          Group=postgres
          EnvironmentFile=/etc/default/postgresql-s3-backup
          ExecStart=/usr/local/sbin/postgresql-s3-backup
          NoNewPrivileges=true
          PrivateTmp=true
          ProtectSystem=full
          ProtectHome=true
          ReadWritePaths={{ db_backup_local_dir }}
        owner: root
        group: root
        mode: "0644"
      notify: Reload systemd and restart PostgreSQL backup timer
      tags: [backup, config, systemd]

    - name: Install PostgreSQL backup timer unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/db-backup.timer
        content: |
          [Unit]
          Description=Daily PostgreSQL S3 backup schedule

          [Timer]
          OnCalendar={{ db_backup_schedule }}
          Persistent=true
          RandomizedDelaySec=15m
          Unit=db-backup.service

          [Install]
          WantedBy=timers.target
        owner: root
        group: root
        mode: "0644"
      notify: Reload systemd and restart PostgreSQL backup timer
      tags: [backup, config, systemd, service]

    - name: Apply systemd unit changes before enabling timer
      ansible.builtin.meta: flush_handlers
      tags: [backup, service, systemd]

    - name: Ensure PostgreSQL backup timer is enabled and running
      ansible.builtin.systemd_service:
        name: db-backup.timer
        enabled: true
        state: started
      tags: [backup, service, systemd]
)
          - db_backup_aws_region | length > 0
          - db_backup_database | length > 0
        fail_msg: "Set a valid S3 bucket, prefix, and PostgreSQL database before scheduling backups."
      tags: [always, platform, backup]

